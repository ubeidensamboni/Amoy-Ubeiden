<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amoy & Ubeiden</title>
  <link rel="stylesheet" href="styles.css" />

    <!--Add Google Font Parisienne here -->
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #f8f8f8;
    }

    .navbar {
      background-color: #000000;
      border-bottom: 1px solid #333333;
    }

    .navbar .btn-m {
      padding: 5px 10px;
      background-color: gold;
      color: white;
      border-radius: 4px;
      text-decoration: none;
      margin-left: 5px;
    }

    header {
      background-image: url('/Amoy-Ubeiden/img/backgrounds/welcome.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: top center;
      background-attachment: fixed;
      color: white;
      text-align: center;
      padding: 100px 20px;
      position: relative;
      overflow: hidden;
    }

    .intro-text {
      max-width: 600px;
      margin: auto;
    }

    .intro-heading {
      font-size: 70px;
      line-height: 70px;
      font-family: 'Parisienne', cursive;
      text-shadow: 2px 2px 4px #000000;
      color: white;
      text-align: center;
      white-space: nowrap;
      padding-bottom: 15px;
    }

    @media (max-width: 768px) {
  .intro-heading {
    font-size: 36px;
    line-height: 42px;
  }
  }


    .btn-xl {
      padding: 15px 30px;
      font-size: 18px;
      background-color: gold;
      color: #fff;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      margin-top: 20px;
      display: inline-block;
    }

    .countdown-embed {
      max-width: 800px;
      margin: 40px auto 20px;
    }

    /* Invitation Overlay */
    #invitation-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #6d744e;/* color open card */
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
      color: white;
    }

    #invitation-overlay h4,
    #invitation-overlay h3,
    #invitation-overlay h1 {
      text-align: center;
      color: white;
      margin: 0;
      padding: 5px 0;
    }

    #invitation-overlay h4 {
      font-size: 18px;
      letter-spacing: 2px;
    }

    #invitation-overlay h3 {
      font-size: 20px;
    }

    #invitation-overlay h1.title {
      font-size: 48px;
      letter-spacing: 4px;
    }

    #invitation-overlay img {
      width: 150px;
      height: auto;
      border-radius: 10px;
      margin: 20px 0;
    }

    #invitation-overlay .names {
      font-family: 'stay_classy_sldtregular';
      font-size: 75px;
      line-height: 75px;
      color: white;
      text-shadow: 2px 2px 4px #000000;
      margin: 0 0 20px;
    }

    .jumping-envelope {
      display: inline-block;
      margin-right: 10px;
      animation: jump 1s infinite;
      font-size: 1.3em;
      vertical-align: middle;
    }

    @keyframes jump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-default navbar-fixed-top">
  <div class="container">
    <div class="navbar-header page-scroll">
      <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <span>
        <a class="brand page-scroll" href="#page-top" style="text-decoration:none">
          <img src="/Amoy-Ubeiden/img/backgrounds/logo.png" alt="Amoy & Ubeiden Logo" style="height: 50px;">
        </a>
        <!--
        <a href="{{ site.baseurl }}/en" class="btn-m">EN</a>
        <a href="{{ site.baseurl }}/fr" class="btn-m">ES</a>
        -->
      </span>
        
    </div>
    <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
      <ul class="nav navbar-nav navbar-right">
        <li class="hidden"><a href="#page-top"></a></li>
        <li><a class="page-scroll" href="#saveDay">Reserva la fecha</a></li>
        <li><a class="page-scroll" href="#our_story">Nuestra historia</a></li>
        <li><a class="page-scroll" href="#events">El Gran Plan</a></li>
        <li><a class="page-scroll" href="#travel">Viaje & Hospedaje</a></li>
        <li><a class="page-scroll hidden-xs hidden-sm" href="#portfolio">Qué hacer</a></li>
        <li><a class="page-scroll" href="#FAQ">FAQ</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Header -->
<header>
  <div style="
    background: rgba(0, 0, 0, 0.5);
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;">
  </div>

  <div class="container" style="position: relative; z-index: 2;">
    <div class="intro-text">
      <div class="intro-heading">Amoy & Ubeiden<br>se casan</div>

      <div class="countdown-embed">
        <script>
          (function(d, s, id) {
            var js, pjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s);
            js.id = id;
            js.src = "//www.tickcounter.com/static/js/loader.js";
            pjs.parentNode.insertBefore(js, pjs);
          }(document, "script", "tickcounter-sdk"));
        </script>

        <a 
          data-type="countdown" 
          data-id="7531725" 
          class="tickcounter" 
          style="display:block; left:0; width:100%; height:0; position:relative; padding-bottom:12%; margin:0 auto; border:none;" 
          title="" 
          href="//www.tickcounter.com/"
        >
         
        </a>
      </div>

      <a href="#saveDay" class="page-scroll btn btn-xl" style="margin-top: 60px; background-color: #daa520; color: white; font-size: 30px; padding: 10px 20px; border-radius: 50px;">
        Agendar
      </a>
    </div>
  </div>
</header>


</body>
</html>
