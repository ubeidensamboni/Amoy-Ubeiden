<!-- Save the Date Section -->
<section id="saveDay" style="position:relative; overflow:hidden; background-image: url('/Amoy-Ubeiden/img/backgrounds/background.png'); background-size: cover; background-repeat: no-repeat; background-position: center; padding: 40px 20px;">

<!-- ✨ GOLD PARTICLES CANVAS -->
<canvas id="saveParticles"></canvas>

<style>

/* =========================
   PARTICLES LAYER
========================= */

#saveParticles {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* keep content above particles */
#saveDay .container {
  position: relative;
  z-index: 2;
}

/* =========================
   OPTIONAL SOFT GLOW LAYER
========================= */

#saveDay::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, rgba(212,175,55,0.08), transparent 70%);
  z-index: 1;
  pointer-events: none;
}

</style>

  <div class="container" style="max-width: 600px; margin: 0 auto; text-align: center;">

    <div style="font-size: 50px; margin-bottom: 10px;">🥂</div>
    <h2 class="section-heading" style="margin-bottom: 20px;">¡El gran día!</h2>

    <div class="date-box" style="display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; margin-bottom: 30px;">
      <div class="date-side" style="padding: 0 15px;">SÁBADO</div>
      <div class="date-center" style="padding: 0 15px; text-align: center;">
        <div class="month">OCTUBRE</div>
        <div class="day" style="font-size: 48px; font-weight: 900;">24</div>
        <div class="year">2026</div>
      </div>
      <div class="date-side" style="padding: 0 15px;">3:00 PM</div>
    </div>

    <h2 class="section-heading" style="margin-bottom: 20px;">Lugar</h2>

    <h4 class="section-subheading"
        style="font-style: normal; font-weight: normal; font-size: 18px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #daa520;">
      Hotel Casa Colonial San Alejo
    </h4>

    <h4 class="section-subheading"
        style="font-style: normal; font-weight: normal; font-size: 18px; margin-bottom: 40px;">
      Tv. 15 #2-74, La Unión, Valle del Cauca, Colombia
    </h4>

    <img 
      src="{{ site.baseurl }}/img/backgrounds/rings.jpg" 
      alt="Rings" 
      style="width: 250px; height: 250px; object-fit: cover; border-radius: 50%; border: 4px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.2); display: block; margin: 0 auto;"
    />

  </div>

<!-- =========================
     PARTICLES SCRIPT
========================= -->

<script>
const canvas = document.getElementById("saveParticles");
const ctx = canvas.getContext("2d");

let particles = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = document.getElementById("saveDay").offsetHeight;
}

window.addEventListener("resize", resize);
resize();

function createParticles() {
  particles = [];
  for (let i = 0; i < 30; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2.5 + 0.5,
      speed: Math.random() * 0.6 + 0.2,
      drift: Math.random() * 0.6 - 0.3,
      alpha: Math.random()
    });
  }
}

createParticles();

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "rgba(212,175,55,0.8)";

  particles.forEach(p => {
    ctx.globalAlpha = p.alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });

  update();
}

function update() {
  particles.forEach(p => {
    p.y -= p.speed;     // upward motion
    p.x += p.drift;     // natural side drift

    if (p.y < 0) {
      p.y = canvas.height;
      p.x = Math.random() * canvas.width;
    }

    if (p.x > canvas.width) p.x = 0;
    if (p.x < 0) p.x = canvas.width;
  });
}

function animate() {
  draw();
  requestAnimationFrame(animate);
}

animate();
</script>

</section>
