<!-- Save the Date Section -->
<section id="saveDay" style="background-image: url('/Amoy-Ubeiden/img/backgrounds/background.png'); background-size: cover; background-repeat: no-repeat; background-position: center; padding: 40px 20px;">
  <div class="container" style="max-width: 600px; margin: 0 auto; text-align: center;">

    <!-- Date Emoji and Heading -->
    <div style="font-size: 50px; margin-bottom: 10px;">🥂</div>
    <h2 class="section-heading" style="margin-bottom: 20px;">El gran día!</h2>

    <!-- Custom Styled Date -->
    <div class="date-box" style="display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; margin-bottom: 30px;">
      <div class="date-side" style="padding: 0 15px;">SÁBADO</div>
      <div class="date-center" style="padding: 0 15px; text-align: center;">
        <div class="month">OCTUBRE</div>
        <div class="day" style="font-size: 48px; font-weight: 900;">24</div>
        <div class="year">2026</div>
      </div>
      <div class="date-side" style="padding: 0 15px;">3:00 PM</div>
    </div>

    <!-- Location -->
    <h4 class="section-subheading" style="font-style: normal; font-weight: normal; font-size: 24px; margin-bottom: 40px;">
      Roldanillo, Valle del Cauca, Colombia
    </h4>

    <!-- Circular Rings Image -->
    <img 
      src="{{ site.baseurl }}/img/backgrounds/rings.png" 
      alt="Rings" 
      style="
        width: 250px;
        height: 250px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid white;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
        display: block;
        margin: 0 auto;
      "
    />

  </div>
</section>
