/* =========================
   TIMELINE BASE
========================= */

#events .timeline {
  list-style: none;
  padding: 0;
  margin: 0 auto;
  max-width: 700px;
  position: relative;
}

/* vertical line */
#events .timeline::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  background-color: white;
  z-index: 0;
}

/* =========================
   EACH ITEM (STACKED)
========================= */

#events .timeline > li {
  display: flex;
  flex-direction: column;   /* 🔥 KEY FIX */
  align-items: center;
  justify-content: center;
  text-align: center;

  margin-bottom: 60px;
  position: relative;
  z-index: 1;
  gap: 10px;
}

/* remove inverted behavior completely */
#events .timeline > li.timeline-inverted {
  flex-direction: column;
}

/* =========================
   ICON
========================= */

#events .timeline-image {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 4px solid white;
  background: #d4af37;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
  flex-shrink: 0;
  z-index: 2;
}

#events .timeline-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* =========================
   TEXT
========================= */

#events .timeline-panel {
  width: 100%;
  color: white;
  display: flex;
  justify-content: center;
}

#events .timeline-heading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

#events .timeline-heading h4 {
  margin: 0;

  color: white;
}

#events .timeline-heading .subheading {
  margin: 0;
  font-size: 15px;
  color: #ccc;
}

/* =========================
   MOBILE (same behavior)
========================= */

@media (max-width: 767px) {

  #events .timeline > li {
    flex-direction: column !important;
    text-align: center;
  }

  #events .timeline-panel {
    width: 100%;
  }
}

</style>
