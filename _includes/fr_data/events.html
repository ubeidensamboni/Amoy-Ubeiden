<section id="events" style="background-image: url('/Amoy-Ubeiden/img/backgrounds/background.png'); background-size: cover; background-repeat: no-repeat; background-position: center;">

<style>

/* =========================
   HARD RESET (IMPORTANT)
========================= */

.timeline,
.timeline * {
  box-sizing: border-box;
}

/* kill ANY old float/Bootstrap interference */
.timeline > li,
.timeline > li * {
  float: none !important;
}

/* =========================
   TIMELINE BASE
========================= */

.timeline {
  list-style: none;
  padding: 0;
  margin: 0 auto;
  max-width: 900px;
  position: relative;
}

/* center line */
.timeline::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 3px;
  background: white;
  z-index: 0;
}

/* ITEM */
.timeline > li {
  display: flex !important;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 80px;
  position: relative;
  z-index: 1;
}

/* invert */
.timeline > li.timeline-inverted {
  flex-direction: row-reverse;
}

/* =========================
   ICON
========================= */

.timeline-image {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 5px solid white;
  background: #d4af37;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  z-index: 2;
}

/* force image behavior */
.timeline-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* =========================
   TEXT
========================= */

.timeline-panel {
  width: 40%;
  color: white;
  padding: 0;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: flex-start;
}

/* =========================
   MOBILE FIX (IMPORTANT)
========================= */

@media (max-width: 767px) {

  .timeline > li,
  .timeline > li.timeline-inverted {
    flex-direction: column !important;
    align-items: center !important;
    text-align: center;
    gap: 15px;
  }

  .timeline-panel {
    width: 100% !important;
    justify-content: center;
  }

  .timeline-image {
    width: 110px;
    height: 110px;
  }

  .timeline::before {
    left: 50%;
  }
}

</style>
