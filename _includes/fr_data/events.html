<!-- 🎇 PARTICLES CANVAS -->
<canvas id="goldParticles"></canvas>

<style>

/* =========================
   CANVAS BACKGROUND
========================= */

#goldParticles {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* keep content above particles */
#events .container {
  position: relative;
  z-index: 2;
}

/* =========================
   TIMELINE BASE
========================= */

#events .timeline {
  list-style: none;
  padding: 0;
  margin: 0 auto;
  max-width: 600px;
  position: relative;
}

#events .timeline::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  background: white;
  box-shadow: 0 0 12px rgba(255,255,255,0.6);
  z-index: 1;
}

/* =========================
   ITEMS
========================= */

#events .timeline > li {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;

  margin-bottom: 80px;
  opacity: 0;
  transform: translateY(30px);
  transition: all 0.8s ease;
  z-index: 2;
}

#events .timeline > li.show {
  opacity: 1;
  transform: translateY(0);
}

/* =========================
   ICON
========================= */

#events .timeline-image {
  width: 120px;
  height: 120px;

  border-radius: 50%;
  border: 4px solid white;
  background: #d4af37;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  animation: heartbeat 1.8s infinite;
}

@keyframes heartbeat {
  0% { transform: scale(1); }
  25% { transform: scale(1.05); }
  50% { transform: scale(1); }
  75% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

#events .timeline-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* =========================
   TEXT
========================= */

#events .timeline-panel {
  margin-top: 15px;
  color: white;
}

#events .timeline-heading h4 {
  margin: 0;
  font-size: 20px;
  font-weight: bold;
}

#events .timeline-heading .subheading {
  margin: 0;
  font-size: 15px;
  color: #ccc;
}

</style>

<!-- =========================
     SCROLL ANIMATION
========================= -->

<script>
document.addEventListener("DOMContentLoaded", function () {
  const items = document.querySelectorAll("#events .timeline li");

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("show");
      }
    });
  }, { threshold: 0.2 });

  items.forEach(item => observer.observe(item));
});
</script>

<!-- =========================
     GOLD PARTICLES SCRIPT
========================= -->

<script>
const canvas = document.getElementById("goldParticles");
const ctx = canvas.getContext("2d");

let particles = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = document.getElementById("events").offsetHeight;
}

window.addEventListener("resize", resize);
resize();

function createParticles() {
  particles = [];
  for (let i = 0; i < 40; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2.5 + 0.5,
      d: Math.random() * 1,
      alpha: Math.random()
    });
  }
}

createParticles();

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "rgba(212,175,55,0.8)"; // gold color

  particles.forEach(p => {
    ctx.beginPath();
    ctx.globalAlpha = p.alpha;
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, false);
    ctx.fill();
  });

  update();
}

function update() {
  particles.forEach(p => {
    p.y -= p.d;     // float upward
    p.x += Math.sin(p.y * 0.01) * 0.3;

    if (p.y < 0) {
      p.y = canvas.height;
      p.x = Math.random() * canvas.width;
    }
  });
}

function animate() {
  draw();
  requestAnimationFrame(animate);
}

animate();
</script>
