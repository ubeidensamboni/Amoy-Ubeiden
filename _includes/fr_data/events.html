<!-- Events Section -->
<section id="events" style="background-image: url('/Amoy-Ubeiden/img/backgrounds/background.png'); background-size: cover; background-repeat: no-repeat; background-position: center;">
  <style>
    .timeline {
      list-style: none;
      padding: 0;
      margin: 0 auto;
      max-width: 1000px;
      position: relative;
    }

    /* Vertical line */
    .timeline::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: white;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
    }

    .timeline > li {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      margin-bottom: 40px;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .timeline > li.timeline-inverted {
      flex-direction: row-reverse;
    }

    .timeline-image {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid white;
      background: #d4af37;
      margin-bottom: 60px;
      overflow: hidden;
      flex-shrink: 0;
      z-index: 2;
    }

    .timeline-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }

    .timeline-panel {
      flex-grow: 1;
      padding: 0 10px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .timeline-panel .timeline-heading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .timeline-heading h4 {
      font-size: 20px;
      font-weight: bold;
      margin: 0;
      color: white;
    }

    .timeline-heading .subheading {
      font-size: 15px;
      color: #ccc;
      margin: 0;
    }

    /* 📱 Mobile view */
    @media (max-width: 767px) {
      .timeline > li,
      .timeline > li.timeline-inverted {
        display: block; /* Stack children vertically */
        margin-bottom: 60px;
      }
      .timeline-image {
        margin: 0 auto 12px auto; /* Center and space below image */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .timeline-panel {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: none;
        box-shadow: none;
        margin-top: 0;
        padding: 0;
      }
      .timeline-panel .timeline-heading {
        align-items: center;
        padding: 0;
      }
      .timeline-heading h4,
      .timeline-heading .subheading {
        text-align: center;
        width: 100%;
        margin: 0;
        word-break: break-word;
      }
    }


  </style>
