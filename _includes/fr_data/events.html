<!-- Events Section -->
<section id="events" style="background-image: url('/Amoy-Ubeiden/img/backgrounds/background.png'); background-size: cover; background-repeat: no-repeat; background-position: center;">

<style>

/* =========================
   RESET + BASE
========================= */

#events .timeline,
#events .timeline * {
  box-sizing: border-box;
}

#events .timeline {
  list-style: none;
  padding: 0;
  margin: 0 auto;
  max-width: 600px;
  position: relative;
}

/* =========================
   GLOWING VERTICAL LINE
========================= */

#events .timeline::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  background: white;
  box-shadow: 0 0 10px rgba(255,255,255,0.6),
              0 0 20px rgba(255,255,255,0.4);
  animation: lineGlow 2.5s ease-in-out infinite alternate;
  z-index: 0;
}

@keyframes lineGlow {
  from {
    box-shadow: 0 0 6px rgba(255,255,255,0.3);
  }
  to {
    box-shadow: 0 0 18px rgba(255,255,255,0.8);
  }
}

/* =========================
   ITEMS
========================= */

#events .timeline > li {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;

  margin-bottom: 80px;
  opacity: 0;
  transform: translateY(30px);
  transition: all 0.8s ease;
  position: relative;
  z-index: 1;
}

/* fade-in active state */
#events .timeline > li.show {
  opacity: 1;
  transform: translateY(0);
}

/* =========================
   ICON (HEARTBEAT PULSE)
========================= */

#events .timeline-image {
  width: 120px;
  height: 120px;

  border-radius: 50%;
  border: 4px solid white;
  background: #d4af37;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
  position: relative;

  animation: heartbeat 1.8s infinite;
}

@keyframes heartbeat {
  0%   { transform: scale(1); }
  25%  { transform: scale(1.05); }
  50%  { transform: scale(1); }
  75%  { transform: scale(1.08); }
  100% { transform: scale(1); }
}

#events .timeline-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* =========================
   TEXT
========================= */

#events .timeline-panel {
  width: 100%;
  margin-top: 15px;
  color: white;
  display: flex;
  justify-content: center;
}

#events .timeline-heading h4 {
  margin: 0;
  font-size: 20px;
  font-weight: bold;
  color: white;
}

#events .timeline-heading .subheading {
  margin: 0;
  font-size: 15px;
  color: #ccc;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 767px) {
  #events .timeline > li {
    margin-bottom: 60px;
  }
}

</style>

<div class="container">

        </li>

        <li>

            <div class="timeline-heading">
              <h4>Reacción Dulce</h4>

            </div>
          </div>
        </li>

        <li>
          <div class="timeline-image">

          <div class="timeline-panel">
            <div class="timeline-heading">

<!-- =========================
     SCROLL ANIMATION SCRIPT
========================= -->

<script>
document.addEventListener("DOMContentLoaded", function () {
  const items = document.querySelectorAll("#events .timeline li");

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("show");
      }
    });
  }, {
    threshold: 0.2
  });

  items.forEach(item => observer.observe(item));
});
</script>
