<!-- Events Section -->
<section id="events" style="background-image: url('/Amoy-Ubeiden/img/backgrounds/background.png'); background-size: cover; background-repeat: no-repeat; background-position: center;">

<style>

/* =========================
   HARD RESET (IMPORTANT)
   kills Bootstrap timeline conflicts ONLY in events
========================= */

#events .timeline,
#events .timeline * {
  box-sizing: border-box;
}

/* remove old pseudo layout conflicts */
#events .timeline::before,
#events .timeline::after {
  display: none !important;
}

/* =========================
   TIMELINE CONTAINER
========================= */

#events .timeline {
  list-style: none;
  padding: 0;
  margin: 0 auto;
  max-width: 600px;
}

/* =========================
   EACH ITEM (STRICT STACK)
========================= */

#events .timeline > li {
  display: flex !important;
  flex-direction: column !important;
  align-items: center;
  justify-content: center;

  text-align: center;

  margin-bottom: 70px; /* 🔥 spacing prevents overlap */
  position: relative;

  padding: 0;
}

/* kill old bootstrap floats completely */
#events .timeline > li .timeline-panel,
#events .timeline > li .timeline-image {
  float: none !important;
  position: static !important;
  margin: 0 !important;
}

/* =========================
   ICON
========================= */

#events .timeline-image {
  width: 120px;
  height: 120px;

  border-radius: 50%;
  border: 4px solid white;
  background: #d4af37;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  flex-shrink: 0;
}

#events .timeline-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* =========================
   TEXT
========================= */

#events .timeline-panel {
  width: 100%;
  margin-top: 15px; /* 🔥 IMPORTANT spacing */
  color: white;
  display: flex;
  justify-content: center;
}

#events .timeline-heading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

#events .timeline-heading h4 {
  margin: 0;
  font-size: 20px;
  font-weight: bold;
  color: white;
}

#events .timeline-heading .subheading {
  margin: 0;
  font-size: 15px;
  color: #ccc;
}

/* =========================
   OPTIONAL CENTER LINE (visual only)
========================= */

#events .timeline {
  position: relative;
}

#events .timeline::before {
  content: "";
  display: block;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  background-color: white;
  z-index: 0;
}

/* keep content above line */
#events .timeline > li {
  z-index: 1;
}

/* =========================
   MOBILE (same layout)
========================= */

@media (max-width: 767px) {
  #events .timeline > li {
    margin-bottom: 60px;
  }
}

</style>
