<!-- Events Section -->
<section id="events" style="background-image: url('/Amoy-Ubeiden/img/backgrounds/background.png'); background-size: cover; background-repeat: no-repeat; background-position: center;">

<style>

  .timeline {
    list-style: none;
    padding: 0;
    margin: 0 auto;
    max-width: 1000px;
    position: relative;
  }

  /* Vertical white line */
  .timeline::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 3px;
    background-color: white;
    left: 50%;
    transform: translateX(-50%);
    z-index: 0;
  }

  .timeline > li {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 60px;
    gap: 40px;
    position: relative;
    z-index: 1;
  }

  /* Alternate desktop layout */
  .timeline > li.timeline-inverted {
    flex-direction: row-reverse;
  }

  /* Circle */
  .timeline-image {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 5px solid white;
    background: #d4af37;
    overflow: hidden;
    flex-shrink: 0;
    z-index: 2;
  }

  .timeline-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
    display: block;
  }

  /* Text panel */
  .timeline-panel {
    width: 300px;
    color: white;
    display: flex;
    align-items: center;
  }

  .timeline-panel .timeline-heading {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .timeline-heading h4 {
    font-size: 24px;
    font-weight: bold;
    margin: 0;
    color: white;
  }

  .timeline-heading .subheading {
    font-size: 17px;
    color: #ddd;
    margin: 0;
  }

  /* ========================= */
  /* 📱 MOBILE VERSION */
  /* ========================= */

  @media (max-width: 767px) {

  /* Vertical center line */
  .timeline::before {
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
  }

  /* Stack everything vertically */
  .timeline > li,
  .timeline > li.timeline-inverted {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    margin-bottom: 70px;
    gap: 0;
  }

  /* ICON */
  .timeline-image {
    width: 120px;
    height: 120px;
    margin: 0;
    position: relative;
    z-index: 2;
  }

  /* TEXT */
  .timeline-panel {
    width: 100%;
    margin-top: 20px; /* space below icon */
    padding: 0;
    background: none;
    box-shadow: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .timeline-panel .timeline-heading {
    text-align: center;
    align-items: center;
    width: 100%;
  }

  .timeline-heading h4 {
    margin: 0;
    font-size: 22px;
    line-height: 1.2;
    color: white;
  }

  .timeline-heading .subheading {
    margin-top: 6px;
    font-size: 16px;
    color: #ddd;
  }
}

</style>
