<!-- invitation.html -->
<div id="invitation-overlay">
  <h1 class="intro-heading" style="margin-top: 10px; margin-bottom: 10px; font-weight: normal;">Nuestra Boda</h1>

  <img src="/Amoy-Ubeiden/img/backgrounds/logo.png" alt="Foto de la pareja" style="margin: 10px 0; width: 60%; max-width: 300px; height: auto;">

  <h1 class="intro-heading" style="margin-top: 25px; margin-bottom: 60px; font-weight: normal;">Amoy & Ubeiden</h1>

  <button onclick="openMainSite()" style="
    padding: 15px 30px;
    font-size: 20px;
    background-color: #daa520;
    color: white;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  ">
    <span class="jumping-envelope" aria-hidden="true">📩</span>
    Abrir Invitación
  </button>
</div>


<script>
  function openMainSite() {
    const overlay = document.getElementById('invitation-overlay');
    if (overlay) {
      overlay.style.display = 'none';
      sessionStorage.setItem('invitationOpened', 'true');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (sessionStorage.getItem('invitationOpened') === 'true') {
      const overlay = document.getElementById('invitation-overlay');
      if (overlay) overlay.style.display = 'none';
    }
  });
</script>
