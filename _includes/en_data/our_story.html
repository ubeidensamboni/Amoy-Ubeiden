<!DOCTYPE html>
<html>
  <head>
    <!-- Include the Imperial Script font -->
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS for Carousel -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .rowstory {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 20px;
      }

      .four-images-row {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 30px;
      }

      .four-images-row img {
        width: 22%;
        height: auto;
        border-radius: 8px;
      }

      @media screen and (max-width: 800px) {
        .four-images-row img {
          width: 45%;
        }
      }

      @media screen and (max-width: 500px) {
        .four-images-row img {
          width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <!-- Our Story Section -->
    <section id="our_story" class="bg-light-gray">
      <div class="container">
        <div class="row">
          <div class="col-lg-12 text-center">
            <h2 class="section-heading">Our Story</h2>
          </div>
        </div>

        <div class="col-lg-8 col-lg-offset-2 text-center" style="margin-top: 10px;">
          <p style="
            font-family: 'Imperial Script', cursive;
            font-size: 36px;
            color: #333;
            margin-bottom: 10px;
          ">
            "When the whole world fell apart, our hearts found each other forever"
          </p>
          <p style="font-size: 16px; color: #555; margin-bottom: 10px;">–March 24, 2020–</p>
        </div>

        <div class="col-lg-8 col-lg-offset-2 text-center">
          <p class="largepad text-muted">
            This phrase and this date mark the beginning of our lives together...
          </p>
        </div>

        <!-- 4 Images Row -->
        <div class="four-images-row">
          <img src="/Amoy-Ubeiden/img/story/1.jpg" alt="Image 1">
          <img src="/Amoy-Ubeiden/img/story/2.jpg" alt="Image 2">
          <img src="/Amoy-Ubeiden/img/story/3.jpg" alt="Image 3">
          <img src="/Amoy-Ubeiden/img/story/4.jpg" alt="Image 4">
        </div>

        <!-- Carousel -->
        <div class="container">
          <div id="storyCarousel" class="carousel slide" data-ride="carousel">
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img class="d-block w-100" src="/Amoy-Ubeiden/img/story/carousel1.jpg" alt="First slide">
              </div>
              <div class="carousel-item">
                <img class="d-block w-100" src="/Amoy-Ubeiden/img/story/carousel2.jpg" alt="Second slide">
              </div>
              <div class="carousel-item">
                <img class="d-block w-100" src="/Amoy-Ubeiden/img/story/carousel3.jpg" alt="Third slide">
              </div>
              <!-- Add more carousel items as needed -->
            </div>
            <a class="carousel-control-prev" href="#storyCarousel" role="button" data-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="sr-only">Previous</span>
            </a>
            <a class="carousel-control-next" href="#storyCarousel" role="button" data-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="sr-only">Next</span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
