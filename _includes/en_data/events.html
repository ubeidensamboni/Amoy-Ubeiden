<!-- Events Section -->
<section id="events" style="background-image: url('/Amoy-Ubeiden/img/backgrounds/background.png'); background-size: cover; background-repeat: no-repeat; background-position: center;">
  <style>
    .timeline {
      list-style: none;
      padding: 0;
      margin: 0 auto;
      max-width: 1000px;
    }

    .timeline > li {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      margin-bottom: 40px;
      gap: 0; /* Reduced space between image and text */
    }

    .timeline > li.timeline-inverted {
      flex-direction: row-reverse;
    }

    .timeline-image {
      flex-shrink: 0;
      text-align: center;
    }

    .timeline-image img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid white;
    }

    .timeline-panel {
      flex-grow: 1;
      text-align: left;
      color: white;
      padding-left: 10px; /* brings text closer to image */
      margin: 0;
    }

    .timeline > li.timeline-inverted .timeline-panel {
      text-align: right;
      padding-left: 0;
      padding-right: 10px;
    }

    .timeline-heading h4 {
      margin-bottom: 8px;
      font-size: 20px;
      font-weight: bold;
    }

    .timeline-heading .subheading {
      font-size: 15px;
      color: #ccc;
    }

    /* Responsive */
    @media (max-width: 767px) {
      .timeline > li,
      .timeline > li.timeline-inverted {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .timeline-panel {
        width: 100%;
        padding: 0;
        margin-top: 10px;
        text-align: center !important;
      }

      .timeline > li.timeline-inverted .timeline-panel {
        padding-right: 0;
      }

      .timeline-image {
        margin-bottom: 10px;
      }
    }
  </style>

  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading">Wedding Day</h2>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-12">
        <ul class="timeline">
          <li>
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/1.png" alt="Ceremony">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Ceremony</h4>
                <h4 class="subheading">3:00 PM</h4>
              </div>
            </div>
          </li>

          <li class="timeline-inverted">
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/2.png" alt="Cocktail">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Cocktail & Photo Booth</h4>
                <h4 class="subheading">3:30 PM</h4>
              </div>
            </div>
          </li>

          <li>
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/3.png" alt="Dinner">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Dinner</h4>
                <h4 class="subheading">5:30 PM</h4>
              </div>
            </div>
          </li>

          <li class="timeline-inverted">
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/4.png" alt="First Dance">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>First Dance</h4>
                <h4 class="subheading">8:00 PM</h4>
              </div>
            </div>
          </li>

          <li>
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/5.png" alt="Special Dance">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Special Dance</h4>
                <h4 class="subheading">8:15 PM</h4>
              </div>
            </div>
          </li>

          <li class="timeline-inverted">
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/6.png" alt="Cake Cutting">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Cake Cutting</h4>
                <h4 class="subheading">8:20 PM</h4>
              </div>
            </div>
          </li>

          <li>
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/7.png" alt="Party Games">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Party Games!</h4>
                <h4 class="subheading">8:50 PM</h4>
              </div>
            </div>
          </li>

          <li class="timeline-inverted">
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/8.png" alt="Dance">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Drink, Dance, Fun, Repeat!!</h4>
                <h4 class="subheading">9:30 PM</h4>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
