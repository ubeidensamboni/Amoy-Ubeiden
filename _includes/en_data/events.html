<!-- Events Section -->
<section id="events" style="background-image: url('/Amoy-Ubeiden/img/backgrounds/background.png'); background-size: cover; background-repeat: no-repeat; background-position: center;">
  <style>
    .timeline {
      list-style: none;
      padding: 0;
      margin: 0 auto;
      max-width: 1000px;
      position: relative;
    }

    /* Vertical line */
    .timeline::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: white;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
    }

    .timeline > li {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      margin-bottom: 40px;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .timeline > li.timeline-inverted {
      flex-direction: row-reverse;
    }

    .timeline-image {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid white;
      background: #d4af37;
      margin-bottom: 10px;
      overflow: hidden;
      flex-shrink: 0;
      z-index: 2;
    }

    .timeline-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }

    .timeline-panel {
      flex-grow: 1;
      padding: 0 10px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .timeline-panel .timeline-heading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .timeline-heading h4 {
      font-size: 20px;
      font-weight: bold;
      margin: 0;
      color: white;
    }

    .timeline-heading .subheading {
      font-size: 15px;
      color: #ccc;
      margin: 0;
    }

    /* 📱 Mobile view */
    @media (max-width: 767px) {
      .timeline::before {
        left: 50%;
        transform: translateX(-50%);
        height: 100%;
      }
      .timeline > li,
      .timeline > li.timeline-inverted {
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 40px;
      }
      .timeline-image {
        margin-bottom: 0;
      }
      .timeline-panel {
        padding: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: none;
        box-shadow: none;
        margin-top: 0;
      }
      .timeline-panel .timeline-heading {
        align-items: center;
        padding: 0;
      }
      .timeline-heading h4,
      .timeline-heading .subheading {
        text-align: center;
        width: 100%;
        margin: 0;
      }
      /* Stack the text directly under the image */
      .timeline > li,
      .timeline > li.timeline-inverted {
        gap: 0;
      }
      .timeline-image + .timeline-panel {
        margin-top: 12px;
      }
    }
  </style>

  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading">Wedding Day</h2>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-12">
        <ul class="timeline">
          <li>
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/1.png" alt="Ceremony">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Ceremony</h4>
                <h4 class="subheading">3:00 PM</h4>
              </div>
            </div>
          </li>

          <li class="timeline-inverted">
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/2.png" alt="Cocktail">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Cocktail & Photo Booth</h4>
                <h4 class="subheading">3:30 PM</h4>
              </div>
            </div>
          </li>

          <li>
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/3.png" alt="Dinner">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Dinner</h4>
                <h4 class="subheading">5:30 PM</h4>
              </div>
            </div>
          </li>

          <li class="timeline-inverted">
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/4.png" alt="First Dance">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>First Dance</h4>
                <h4 class="subheading">8:00 PM</h4>
              </div>
            </div>
          </li>

          <li>
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/5.png" alt="Special Dance">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Special Dance</h4>
                <h4 class="subheading">8:15 PM</h4>
              </div>
            </div>
          </li>

          <li class="timeline-inverted">
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/6.png" alt="Cake Cutting">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Cake Cutting</h4>
                <h4 class="subheading">8:20 PM</h4>
              </div>
            </div>
          </li>

          <li>
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/7.png" alt="Party Games">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Party Games!</h4>
                <h4 class="subheading">8:50 PM</h4>
              </div>
            </div>
          </li>

          <li class="timeline-inverted">
            <div class="timeline-image">
              <img src="/Amoy-Ubeiden/img/events/8.png" alt="Dance">
            </div>
            <div class="timeline-panel">
              <div class="timeline-heading">
                <h4>Drink, Dance, Fun, Repeat!!</h4>
                <h4 class="subheading">9:30 PM</h4>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
