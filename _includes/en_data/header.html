<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amoy & Ubeiden Wedding</title>

  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #f8f8f8;
    }

    .navbar {
      background-color: #fff;
      border-bottom: 1px solid #ddd;
      padding: 10px 20px;
    }

    .navbar .btn-m {
      padding: 5px 10px;
      background-color: gold;
      color: white;
      border-radius: 4px;
      text-decoration: none;
      margin-left: 5px;
    }

    .intro-section, .save-the-date {
      background: #333 url('your-background.jpg') no-repeat center center;
      background-size: cover;
      color: white;
      text-align: center;
      padding: 100px 20px;
    }

    .intro-text {
      max-width: 600px;
      margin: auto;
    }

    .intro-heading {
      font-size: 48px;
      font-weight: bold;
    }

    .intro-lead-in {
      font-size: 20px;
      margin: 10px 0;
    }

    .btn-xl {
      padding: 15px 30px;
      font-size: 18px;
      background-color: gold;
      color: #fff;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      margin-top: 20px;
      display: inline-block;
    }

    .countdown-timer {
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
      color: #fff;
    }

    section {
      padding: 60px 20px;
    }

    .section-title {
      font-size: 32px;
      text-align: center;
      margin-bottom: 40px;
    }
  </style>
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-default navbar-fixed-top">
  <div class="container">
    <div class="navbar-header">
      <span>
        <a class="brand" href="#page-top" style="text-decoration:none">Amoy & Ubeiden</a>
        <a href="/Amoy-Ubeiden/en" class="btn-m">EN</a>
        <a href="/Amoy-Ubeiden/fr" class="btn-m">ES</a> 
      </span>
    </div>
  </div>
</nav>

<!-- Welcome Section -->
<header class="intro-section" id="welcome">
  <div class="intro-text">
    <div class="intro-heading">Amoy & Ubeiden<br>are getting married</div>
    <div class="intro-lead-in">October 24, 2026</div>
    <div class="intro-lead-in">Roldanillo, Valle del Cauca, Colombia</div>
    <div id="countdown1" class="intro-lead-in countdown-timer"></div>
    <a href="#save-the-date" class="btn-xl">SAVE THE DATE</a>
  </div>
</header>

<!-- Save the Date Section -->
<section class="save-the-date" id="save-the-date">
  <div class="intro-text">
    <div class="intro-heading">Save the Date!</div>
    <div class="intro-lead-in">We're counting down to the big day</div>
    <div id="countdown2" class="countdown-timer"></div>
    <a href="#events" class="btn-xl">SEE THE EVENTS</a>
  </div>
</section>

<!-- Events Section Placeholder -->
<section id="events">
  <h2 class="section-title">Events</h2>
  <p style="text-align: center;">(Event details go here...)</p>
</section>

<!-- Countdown Script -->
<script>
  function startCountdown(id, targetDateStr) {
    const countdownEl = document.getElementById(id);
    function update() {
      const now = new Date().getTime();
      const targetDate = new Date(targetDateStr).getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        countdownEl.innerHTML = "The big day is here!";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdownEl.innerHTML = `${days} Days ${hours} Hours ${minutes} Minutes ${seconds} Seconds`;
    }

    update();
    setInterval(update, 1000);
  }

  startCountdown("countdown1", "October 24, 2026 00:00:00");
  startCountdown("countdown2", "October 24, 2026 00:00:00");
</script>

</body>
</html>
