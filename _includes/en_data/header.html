<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amoy & Ubeiden</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #f8f8f8;
    }

    .navbar {
      background-color: #000000;
      border-bottom: 1px solid #333333;
    }

    .navbar .btn-m {
      padding: 5px 10px;
      background-color: gold;
      color: white;
      border-radius: 4px;
      text-decoration: none;
      margin-left: 5px;
    }

    header {
      background-image: url('/Amoy-Ubeiden/img/backgrounds/welcome.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: top center;
      background-attachment: fixed;
      color: white;
      text-align: center;
      padding: 100px 20px;
      position: relative;
      overflow: hidden;
    }

    .intro-text {
      max-width: 600px;
      margin: auto;
    }

    .intro-heading {
      font-size: 75px;
      line-height: 75px;
      font-family: 'stay_classy_sldtregular';
      text-shadow: 2px 2px 4px #000000;
      color: white;
      text-align: center;
      white-space: nowrap;
      padding-bottom: 15px;
    }

    .btn-xl {
      padding: 15px 30px;
      font-size: 18px;
      background-color: gold;
      color: #fff;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      margin-top: 20px;
      display: inline-block;
    }

    .countdown-embed {
      max-width: 800px;
      margin: 40px auto 20px;
    }

    /* Invitation Overlay */
    #invitation-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #222;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
      color: white;
    }

    #invitation-overlay h1,
    #invitation-overlay h2 {
      font-family: 'stay_classy_sldtregular';
      text-shadow: 2px 2px 4px #000000;
      text-align: center;
      color: white;
      margin: 0 0 20px;
      padding-bottom: 15px;
    }

    #invitation-overlay h2 {
      font-size: 55px;
      line-height: 60px;
    }

    #invitation-overlay h1 {
      font-size: 75px;
      line-height: 75px;
    }

    #invitation-overlay img {
      width: 150px;
      height: auto;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .jumping-envelope {
      display: inline-block;
      margin-right: 10px;
      animation: jump 1s infinite;
      font-size: 1.3em;
      vertical-align: middle;
    }

    @keyframes jump {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>

    align-items: center;
    justify-content: center;

  ">
    <span class="jumping-envelope" aria-hidden="true">📩</span>
    Open Invitation
