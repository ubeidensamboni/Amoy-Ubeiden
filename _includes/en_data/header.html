<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amoy & Ubeiden</title>
  <!-- Google Font for names -->
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #6d1a14;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      width: 100vw;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    #invitation-overlay, .main-cover, body {
  min-height: 100vh;
  min-width: 100vw;
  display: flex;
  flex-direction: column;
  justify-content: center; /* vertical centering */
  align-items: center;     /* horizontal centering */
  background: #6d1a14;     /* match your background */
  margin: 0;
  padding: 0;
}
    .overlay-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }
    .passport-header {
      margin-bottom: 18px;
    }
    .passport-title {
      font-family: 'Times New Roman', serif;
      font-size: 22px;
      letter-spacing: 0.3em;
      color: #ffe080;
      margin: 0;
      text-align: center;
    }
    .passport-subtitle {
      font-family: 'Times New Roman', serif;
      font-size: 13px;
      letter-spacing: 0.18em;
      color: #ffe080;
      margin: 0 0 10px 0;
      text-align: center;
    }
    .passport-globe {
      width: 220px;
      max-width: 70vw;
      margin: 0 0 18px 0;
      display: block;
    }
    .names {
      font-family: 'Parisienne', cursive;
      font-size: 38px;
      color: #ffe080;
      margin: 10px 0 16px 0;
      text-align: center;
      letter-spacing: 0.04em;
    }
    .passport-icon {
      width: 38px;
      height: 38px;
      margin: 0 0 18px 0;
      display: block;
    }
    .open-invitation-btn {
      padding: 16px 40px;
      font-size: 22px;
      background-color: #daa520;
      color: #fff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      margin-top: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      transition: background 0.2s;
    }
    .open-invitation-btn:hover {
      background: #b8860b;
    }
    .envelope-icon {
      margin-right: 10px;
      font-size: 1.3em;
      animation: jump 1s infinite;
      vertical-align: middle;
    }
    @keyframes jump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    /* Responsive adjustments */
    @media (min-width: 700px) {
      .overlay-content {
        max-width: 480px;
      }
      .passport-title { font-size: 28px; }
      .passport-subtitle { font-size: 16px; }
      .passport-globe { width: 300px; }
      .names { font-size: 54px; }
      .passport-icon { width: 48px; height: 48px; }
      .open-invitation-btn { font-size: 26px; padding: 20px 60px; }
    }
    @media (max-width: 400px) {
      .passport-title { font-size: 16px; }
      .passport-subtitle { font-size: 10px; }
      .passport-globe { width: 140px; }
      .names { font-size: 26px; }
      .passport-icon { width: 28px; height: 28px; }
      .open-invitation-btn { font-size: 16px; padding: 10px 20px; }
    }
  </style>
</head>
<body>
  <!-- Invitation Overlay -->
  <div id="invitation-overlay">
    <div class="overlay-content">
      <div class="passport-header">
        <div class="passport-title">PASSPORT</div>
        <div class="passport-subtitle">WEDDING INVITATION</div>
      </div>
      <!-- Replace with your globe image or SVG -->
      <img src="/Amoy-Ubeiden/img/backgrounds/logo1.png" alt="Globe" class="passport-globe">
      <div class="names">Amoy & Ubeiden</div>
      <!-- Replace with your biometric icon -->
      <img src="/Amoy-Ubeiden/img/backgrounds/logo2.png" alt="bioMetric" class="passport-icon">
      <button class="open-invitation-btn" onclick="openMainSite()">
        <span class="envelope-icon" aria-hidden="true">📩</span>
        Open Invitation
      </button>
    </div>
  </div>
  <script>
    function openMainSite() {
      const overlay = document.getElementById('invitation-overlay');
      if (overlay) {
        overlay.style.display = 'none';
        sessionStorage.setItem('invitationOpened', 'true');
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('invitationOpened') === 'true') {
        const overlay = document.getElementById('invitation-overlay');
        if (overlay) overlay.style.display = 'none';
      }
    });
  </script>
</body>
</html>
