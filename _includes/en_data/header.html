<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amoy & Ubeiden</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #f8f8f8;
    }

  .navbar {
  background-color: #000000; /* black */
  border-bottom: 1px solid #333333; /* dark gray border */
}


    .navbar .btn-m {
      padding: 5px 10px;
      background-color: gold;
      color: white;
      border-radius: 4px;
      text-decoration: none;
      margin-left: 5px;
    }

    header {
      background-image: url('/Amoy-Ubeiden/img/backgrounds/welcome.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: top center;
      /*background-position: center center; */      /* This line is commented out; if used, it would align background image at the center center */
      background-attachment: fixed;
      color: white;
      background-repeat: none;                   /* Prevents the background image from repeating (Note: usually `no-repeat` is used) */
      -webkit-background-size: cover;            /* For Safari and older Chrome: scale background image to cover entire header */
      -moz-background-size: cover;               /* For older Firefox: same as above */
      text-align: center;
      padding: 100px 20px;
      position: relative;
      overflow: hidden;
    }

    .intro-text {
      max-width: 600px;
      margin: auto;
    }

    .intro-heading {
      font-size: 48px;
      font-weight: bold;
    }

    .intro-lead-in {
      font-size: 20px;
      margin: 10px 0;
    }

    .btn-xl {
      padding: 15px 30px;
      font-size: 18px;
      background-color: gold;
      color: #fff;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      margin-top: 20px;
      display: inline-block;
    }

    .countdown-embed {
      max-width: 800px;
      margin: 40px auto 20px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-default navbar-fixed-top">

        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <span>
        <a class="brand page-scroll" href="#page-top" style="text-decoration:none">Amoy & Ubeiden</a>&nbsp;&nbsp;&nbsp;
        <a href="/Amoy-Ubeiden/en" class="btn-m">EN</a>
        <a href="/Amoy-Ubeiden/fr" class="btn-m">ES</a> 
      </span>
    </div>
    <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
      <ul class="nav navbar-nav navbar-right">
        <li class="hidden"><a href="#page-top"></a></li>

<!-- Header -->
<header>
  <!-- Dark Overlay -->
  <div style="
    background: rgba(0, 0, 0, 0.5);  /* Increased opacity */
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;">
  </div>

  <!-- Main Content -->
  <div class="container" style="position: relative; z-index: 2;">
    <div class="intro-text">
      <div class="intro-heading">Amoy & Ubeiden<br>are getting married</div>

       <!-- <div class="intro-lead-in">October 24, 2026</div>   -->

      <!-- TickCounter Countdown Embed -->
<div class="countdown-embed">
  <script>
    (function(d, s, id) {
      var js, pjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return;
      js = d.createElement(s);
      js.id = id;
      js.src = "//www.tickcounter.com/static/js/loader.js";
      pjs.parentNode.insertBefore(js, pjs);
    }(document, "script", "tickcounter-sdk"));
  </script>

  <a 
    data-type="countdown" 
    data-id="7506491" 
    class="tickcounter" 
    style="display:block; left:0; width:100%; height:0; position:relative; padding-bottom:25%; margin:0 auto; border:none;" 
    title="Big Day" 
    href="//www.tickcounter.com/"
  >
    Big Day
  </a>
</div>

      <a href="#events" class="page-scroll btn btn-xl" style="background-color: gold; color: white;">Save the Date!</a>
    </div>
  </div>
</header>
