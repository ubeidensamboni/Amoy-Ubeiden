<!-- invitation.html -->
<div id="invitation-overlay">
  <h1 class="gradient-text gradient-title" style="letter-spacing: 8px;">PASSPORT</h1>
  <h3 class="gradient-text" style="margin-top: 30px;">YOU ARE INVITED</h3>
  <img src="/Amoy-Ubeiden/img/backgrounds/logo1.png" alt="Couple Photo" style="margin: 30px 0; width: 60%; max-width: 300px; height: auto;">
  <h4 class="gradient-text" style="margin-top: 10px;">TO THE WEDDING OF</h4>
  <h1 class="gradient-script" style="margin-top: 40px; margin-bottom: 60px;">Amoy & Ubeiden</h1>

  <!-- ✅ Moved the button INSIDE the overlay -->
  <button onclick="openMainSite()" style="
    margin-top: 20px;
    padding: 15px 30px;
    font-size: 20px;
    background-color: #daa520;
    color: white;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  ">
    <span class="jumping-envelope" aria-hidden="true">📩</span>
    Open Invitation
  </button>
</div>

<script>
  function openMainSite() {
    const overlay = document.getElementById('invitation-overlay');
    if (overlay) {
      overlay.style.display = 'none';
      sessionStorage.setItem('invitationOpened', 'true');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (sessionStorage.getItem('invitationOpened') === 'true') {
      const overlay = document.getElementById('invitation-overlay');
      if (overlay) overlay.style.display = 'none';
    }
  });
</script>
