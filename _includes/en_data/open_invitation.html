<head>
  <style>
    .invitation-envelope {
      width: 300px;
      height: 200px;
      background: #fff;
      border: 2px solid #ccc;
      position: relative;
      margin: 20px auto;
      cursor: pointer;
      overflow: hidden;
      transition: transform 1s;
    }

    .invitation-envelope.opened .flap {
      transform: rotateX(180deg);
    }

    .flap {
      position: absolute;
      top: 0;
      width: 100%;
      height: 50%;
      background: #eee;
      transform-origin: top;
      transition: transform 1s;
    }

    .paper {
      position: absolute;
      top: 50%;
      width: 100%;
      height: 50%;
      background: #fafafa;
      padding: 10px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="invitation-envelope" onclick="openInvitation(this)">
    <div class="flap"></div>
    <div class="paper">
      <p>You’re invited!</p>
    </div>
  </div>

  <script>
    function openInvitation(el) {
      el.classList.toggle("opened");
    }
  </script>
</body>
